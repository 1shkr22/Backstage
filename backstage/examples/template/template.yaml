apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aviso-ecs-service
  title: ECS Service Deployment
  description: Create a new ECS service or trigger an existing deployment workflow
  tags:
    - aws
    - ecs
    - deployment
    - github-actions

spec:
  owner: team:platform
  type: service

  ############################
  # PARAMETERS
  ############################
  parameters:
    - title: Deployment Options
      required:
        - serviceMode
      properties:
        serviceMode:
          title: What do you want to do?
          type: string
          default: create
          enum:
            - create
            - trigger
          enumNames:
            - Create a new ECS service
            - Trigger existing deployment workflow

        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            requestUserPermission:
              - repo
              - workflow

        environment:
          title: Environment
          type: string
          default: dev
          enum:
            - dev
            - staging
            - prod

      dependencies:
        serviceMode:
          oneOf:
            # =====================================================
            # CREATE NEW ECS SERVICE
            # =====================================================
            - properties:
                serviceMode:
                  const: create

                ecsCluster:
                  title: ECS Cluster
                  type: string
                  description: ECS cluster where service will be created

                ecsServiceName:
                  title: ECS Service Name
                  type: string

                taskFamilyName:
                  title: Task Definition Family Name
                  type: string
                  description: The family name (usually ends with -td)
                  default: "plg-selfservice-demo-td"  

                ecrRepository:
                  title: ECR Repository Name
                  type: string

                containerName:
                  title: Container Name
                  type: string
                  default: app

                containerImage:
                  title: Container Image
                  type: string
                  description: Initial image (can be placeholder, e.g. nginx:latest)

                cpu:
                  title: vCPU Units
                  type: string
                  default: "512"
                  enum:
                    - "256"
                    - "512"
                    - "1024"
                    - "2048"
                    - "4096"

                memory:
                  title: Memory (MB)
                  type: string
                  default: "1024"
                  enum:
                    - "512"
                    - "1024"
                    - "2048"
                    - "4096"
                    - "8192"

                awsRegion:
                  title: AWS Region
                  type: string
                  default: us-east-1

              required:
                - repoUrl
                - environment
                - ecsCluster
                - ecsServiceName
                - ecrRepository
                - containerName
                - containerImage
                - cpu
                - memory
                - awsRegion

            # =====================================================
            # TRIGGER EXISTING WORKFLOW
            # =====================================================
            - properties:
                serviceMode:
                  const: trigger

              required:
                - repoUrl
                - environment

  ############################
  # STEPS
  ############################
  steps:
    # ---------------------------------------------------------
    # CREATE FLOW (AWS)
    # ---------------------------------------------------------
    - id: create-ecr
      if: ${{ parameters.serviceMode === 'create' }}
      name: Create ECR Repository
      action: aws:ecr:create
      input:
        repositoryName: ${{ parameters.ecrRepository }}
        region: ${{ parameters.awsRegion }}

    - id: register-task-def
      if: ${{ parameters.serviceMode === 'create' }}
      name: Register ECS Task Definition
      action: aws:ecs:register-task-def
      input:
        family: ${{ parameters.ecsServiceName }}
        containerName: ${{ parameters.containerName }}
        image: ${{ parameters.containerImage }}
        cpu: ${{ parameters.cpu }}
        memory: ${{ parameters.memory }}
        region: ${{ parameters.awsRegion }}
        executionRoleArn: "arn:aws:iam::369521641981:role/ecsTaskExecutionRole"

    - id: create-ecs-service
      if: ${{ parameters.serviceMode === 'create' }}
      name: Create ECS Service
      action: aws:ecs:create-service
      input:
        cluster: ${{ parameters.ecsCluster }}
        serviceName: ${{ parameters.ecsServiceName }}
        region: ${{ parameters.awsRegion }}

        # Wrap the logic in a JSON filter to ensure it remains an array
        subnets: ${{ [
            'subnet-0e9d3f1ad15c0ee74',
            'subnet-07cc2e35a5592549c',
            'subnet-093d89d1190420ba3',
            'subnet-04119f906b86b11ed'
          ] if parameters.environment == 'dev' else [
            'subnet-3c0f0514',
            'subnet-8b795ffc',
            'subnet-ed8e64b4'
          ] }}

        securityGroups:
          ${{ ['sg-0313a6e7a7b90578c'] if parameters.environment == 'dev' else ['sg-0c0a6611b141ad86d'] }}

        taskDefinition: >-
          {%- if parameters.environment == 'dev' -%}
            arn:aws:ecs:${{ parameters.awsRegion }}:369521641981:task-definition/${{ parameters.ecsServiceName }}
          {%- else -%}
            arn:aws:ecs:${{ parameters.awsRegion }}:270591008196:task-definition/${{ parameters.ecsServiceName }}
          {%- endif -%}

    - id: register-service
      if: ${{ parameters.serviceMode === 'create' }}
      name: Register Service in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ parameters.repoUrl }}
        catalogInfoPath: /catalog-info.yaml

    # ---------------------------------------------------------
    # TRIGGER FLOW (GITHUB ACTIONS)
    # ---------------------------------------------------------
    - id: trigger-deployment
      if: ${{ parameters.serviceMode === 'trigger' }}
      name: Trigger Deployment Workflow
      action: github:actions:dispatch
      input:
        repoUrl: ${{ parameters.repoUrl }}
        workflowId: ecs-plg-selfservice-dev.yml
        branchOrTagName: dev
        workflowInputs:
          environment: ${{ parameters.environment }}

  ############################
  # OUTPUT
  ############################
  output:
    links:
      - title: GitHub Repository
        url: ${{ parameters.repoUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps.register-service.output.entityRef }}
