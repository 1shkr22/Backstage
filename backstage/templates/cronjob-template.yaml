apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ecs-cronjob-setup
  title: ECS CronJob Setup
  description: Create or update a scheduled ECS Fargate task
spec:
  owner: team:platform
  type: service

  parameters:
    # =====================================================
    # CRON / RATE / UPDATE CONFIGURATION
    # =====================================================
    - title: Cron Configuration
      properties:
        scheduleType:
          title: Action
          type: string
          enum: [rate, cron, update]
          default: cron

      dependencies:
        scheduleType:
          oneOf:
            # -----------------------------
            # RATE (CREATE)
            # -----------------------------
            - properties:
                scheduleType:
                  const: rate

                intervalValue:
                  title: Every X minutes
                  type: number
                  default: 60
                  minimum: 1

                timezone:
                  title: Timezone
                  type: string
                  enum: [UTC, IST]
                  default: UTC

              required: [intervalValue, timezone]

            # -----------------------------
            # CRON (CREATE)
            # -----------------------------
            - properties:
                scheduleType:
                  const: cron

                minute: { type: string, default: "0" }
                hour: { type: string, default: "*" }
                dayOfMonth: { type: string, default: "*" }
                month: { type: string, default: "*" }
                dayOfWeek: { type: string, default: "?" }
                year: { type: string, default: "*" }

                timezone:
                  title: Timezone
                  type: string
                  enum: [UTC, IST]
                  default: UTC

              required:
                - minute
                - hour
                - dayOfMonth
                - month
                - dayOfWeek
                - year
                - timezone

            # -----------------------------
            # UPDATE EXISTING RULE
            # -----------------------------
            - properties:
                scheduleType:
                  const: update

                ruleName:
                  title: EventBridge Rule Name
                  type: string
                  description: Existing EventBridge rule to update

                minute: { type: string, default: "0" }
                hour: { type: string, default: "*" }
                dayOfMonth: { type: string, default: "*" }
                month: { type: string, default: "*" }
                dayOfWeek: { type: string, default: "?" }
                year: { type: string, default: "*" }

                timezone:
                  title: Timezone
                  type: string
                  enum: [UTC, IST]
                  default: UTC

              required:
                - ruleName
                - minute
                - hour
                - dayOfMonth
                - month
                - dayOfWeek
                - year
                - timezone

    # =====================================================
    # AWS CONFIGURATION
    # =====================================================
    - title: AWS Configuration
      required: [region, environment]
      properties:
        region:
          title: AWS Region
          type: string
          enum: [us-east-1, us-east-2, us-west-1, us-west-2]
          default: us-east-1

        environment:
          type: string
          enum: [dev, prod]
          default: dev

        # USED ONLY FOR CREATE
        ecsCluster: { type: string }
        taskFamily: { type: string }
        containerImage: { type: string }
        logGroup: { type: string }

        cpu:
          type: string
          default: "1024"
          enum: ["512", "1024", "2048"]
        memory:
          type: string
          default: "2048"
          enum: ["1024", "2048", "4096"]

  steps:
    # =====================================================
    # REGISTER TASK DEFINITION (CREATE ONLY)
    # =====================================================
    - id: register-cron-task-def
      if: ${{ parameters.scheduleType != 'update' }}
      name: Register Cron Task Definition
      action: aws:ecs:register-task-def
      input:
        family: ${{ parameters.taskFamily }}
        containerName: cron
        image: ${{ parameters.containerImage }}
        cpu: ${{ parameters.cpu }}
        memory: ${{ parameters.memory }}
        region: ${{ parameters.region }}
        executionRoleArn: arn:aws:iam::369521641981:role/ecsTaskExecutionRole

    # =====================================================
    # CREATE EVENTBRIDGE RULE (WITH ECS TARGET)
    # =====================================================
    - id: create-ecs-cron
      if: ${{ parameters.scheduleType != 'update' }}
      name: Create EventBridge Cron
      action: aws:eventbridge:create-cron
      input:
        ruleName: ${{ parameters.taskFamily }}-rule

        scheduleExpression: >-
          {%- if parameters.scheduleType == 'rate' -%}
          rate(${{ parameters.intervalValue }} minutes)
          {%- else -%}
          cron(${{ parameters.minute }} ${{ parameters.hour }} ${{ parameters.dayOfMonth }} ${{ parameters.month }} ${{ parameters.dayOfWeek }} ${{ parameters.year }})
          {%- endif -%}

        timezone: ${{ parameters.timezone }}
        region: ${{ parameters.region }}

        clusterArn: arn:aws:ecs:${{ parameters.region }}:369521641981:cluster/${{ parameters.ecsCluster }}
        taskDefinitionArn: arn:aws:ecs:${{ parameters.region }}:369521641981:task-definition/${{ parameters.taskFamily }}
        roleArn: arn:aws:iam::369521641981:role/ecsEventsRole

        subnets:
          - subnet-0e9d3f1ad15c0ee74
          - subnet-07cc2e35a5592549c
          - subnet-093d89d1190420ba3
          - subnet-04119f906b86b11ed

        securityGroups:
          - sg-0313a6e7a7b90578c

    # =====================================================
    # UPDATE EVENTBRIDGE RULE (SCHEDULE ONLY)
    # =====================================================
    - id: update-ecs-cron
      if: ${{ parameters.scheduleType == 'update' }}
      name: Update EventBridge Cron Schedule
      action: aws:eventbridge:create-cron
      input:
        ruleName: ${{ parameters.ruleName }}

        scheduleExpression: >-
          cron(${{ parameters.minute }} ${{ parameters.hour }} ${{ parameters.dayOfMonth }} ${{ parameters.month }} ${{ parameters.dayOfWeek }} ${{ parameters.year }})

        timezone: ${{ parameters.timezone }}
        region: ${{ parameters.region }}
