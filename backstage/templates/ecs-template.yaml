apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aviso-ecs-service-template
  title: Aviso ECS Service Template
  description: Create or deploy ECS services via Backstage
  tags:
    - aws
    - ecs
    - docker
    - github-actions

spec:
  owner: team:platform
  type: service

  ############################
  # PARAMETERS
  ############################
  parameters:

    # NEW — SERVICE MODE
    - title: Service Mode
      required:
        - serviceMode
      properties:
        serviceMode:
          title: What do you want to do?
          type: string
          default: create
          enum:
            - create
            - deploy
          enumNames:
            - Create a new ECS service
            - Deploy an existing ECS service

    # -------------------------
    # SERVICE INFORMATION
    # -------------------------
    - title: Service Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - user
              - group

    # -------------------------
    # REPOSITORY CONFIG
    # -------------------------
    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            requestUserPermission:
              - repo
              - workflow

    # -------------------------
    # ECS CONFIG (NEW SERVICE)
    # -------------------------
    - title: AWS ECS Configuration
      properties:
        awsRegion:
          title: AWS Region
          type: string
          default: us-east-1
          enum:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
            - eu-west-1
            - eu-central-1
            - ap-south-1

        ecrRepository:
          title: ECR Repository Name
          type: string

        ecsCluster:
          title: ECS Cluster Name
          type: string

        ecsServiceName:
          title: ECS Service Name
          type: string

        taskDefinitionFamily:
          title: Task Definition Family
          type: string

        containerPort:
          title: Container Port
          type: integer
          default: 3000

        cpu:
          title: CPU Units
          type: integer
          default: 256

        memory:
          title: Memory (MB)
          type: integer
          default: 512

    # -------------------------
    # ENVIRONMENT CONFIG
    # -------------------------
    - title: Environment Configuration
      properties:
        environment:
          title: Environment
          type: string
          default: dev
          enum:
            - dev
            - staging
            - prod

    # NEW — EXISTING SERVICE DEPLOYMENT
    - title: Existing Service Deployment
      properties:
        workflowFile:
          title: GitHub Workflow File
          type: string
          description: Workflow inside .github/workflows
          default: ecs-deploy.yml

        workflowRef:
          title: Git Reference
          type: string
          default: main

  ############################
  # STEPS
  ############################
  steps:

    # CHANGED — Parse RepoUrlPicker output
    - id: parse-repo
      name: Parse Repository
      action: catalog:parseRepoUrl
      input:
        repoUrl: ${{ parameters.repoUrl }}

    # =========================
    # CREATE NEW SERVICE FLOW
    # =========================
    # NEW — Conditional execution
    - id: fetch-template
      if: ${{ parameters.serviceMode === 'create' }}
      name: Fetch Template Files
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          repoUrl: https://${{ steps.parse-repo.output.repo.host }}/${{ steps.parse-repo.output.repo.owner }}/${{ steps.parse-repo.output.repo.repo }}
          awsRegion: ${{ parameters.awsRegion }}
          ecrRepository: ${{ parameters.ecrRepository }}
          ecsCluster: ${{ parameters.ecsCluster }}
          ecsServiceName: ${{ parameters.ecsServiceName }}
          taskDefinitionFamily: ${{ parameters.taskDefinitionFamily }}
          containerPort: ${{ parameters.containerPort }}
          cpu: ${{ parameters.cpu }}
          memory: ${{ parameters.memory }}
          environment: ${{ parameters.environment }}

    # CHANGED — Only create repo when creating service
    - id: publish
      if: ${{ parameters.serviceMode === 'create' }}
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main

    # CHANGED — Register only for new services
    - id: register
      if: ${{ parameters.serviceMode === 'create' }}
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # =========================
    # DEPLOY EXISTING SERVICE
    # =========================
    # NEW — Trigger GitHub Actions workflow
    - id: deploy-existing
      if: ${{ parameters.serviceMode === 'deploy' }}
      name: Trigger ECS Deployment
      action: github:actions:dispatch
      input:
        repoUrl: ${{ parameters.repoUrl }}
        workflowId: ${{ parameters.workflowFile }}
        ref: ${{ parameters.workflowRef }}
        inputs:
          environment: ${{ parameters.environment }}

  ############################
  # OUTPUT
  ############################
  output:
    links:
      # CHANGED — Human-readable GitHub URL
      - title: GitHub Repository
        url: https://${{ steps.parse-repo.output.repo.host }}/${{ steps.parse-repo.output.repo.owner }}/${{ steps.parse-repo.output.repo.repo }}

      # NEW — Catalog link only exists for create flow
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
