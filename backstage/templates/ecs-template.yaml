apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aviso-ecs-service
  title: ECS Service Deployment
  description: Create a new ECS service or trigger an existing deployment workflow
  tags:
    - aws
    - ecs
    - deployment
    - github-actions

spec:
  owner: team:platform
  type: service

  ############################
  # PARAMETERS
  ############################
  parameters:
    - title: Deployment Options
      required:
        - serviceMode
      properties:
        serviceMode:
          title: What do you want to do?
          type: string
          default: create
          enum: [create, trigger]
          enumNames:
            - Create a new ECS service
            - Trigger existing deployment workflow

        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
            requestUserPermission: [repo, workflow]

        environment:
          title: Environment
          type: string
          default: dev
          enum: [dev, staging, prod]

      dependencies:
        serviceMode:
          oneOf:
            # =====================================================
            # CREATE NEW ECS SERVICE
            # =====================================================
            - properties:
                serviceMode:
                  const: create

                ecsCluster:
                  title: ECS Cluster
                  type: string

                ecsServiceName:
                  title: ECS Service Name
                  type: string

                ecrRepository:
                  title: ECR Repository Name
                  type: string

                containerName:
                  title: Container Name
                  type: string
                  default: app

                containerPort:
                  title: Container Port
                  type: number
                  default: 8000
                  description: Port on which the container listens  

                containerImage:
                  title: Container Image
                  type: string

                cpu:
                  title: vCPU Units
                  type: string
                  default: "512"
                  enum: ["256", "512", "1024", "2048", "4096"]

                memory:
                  title: Memory (MB)
                  type: string
                  default: "1024"
                  enum: ["512", "1024", "2048", "4096", "8192"]

                awsRegion:
                  title: AWS Region
                  type: string
                  default: us-east-1

                # 🔹 NEW: ALB toggle
                enableLoadBalancer:
                  title: Expose service via Load Balancer
                  type: boolean
                  default: false

              required:
                - repoUrl
                - environment
                - ecsCluster
                - ecsServiceName
                - ecrRepository
                - containerName
                - containerPort
                - containerImage
                - cpu
                - memory
                - awsRegion

              dependencies:
                enableLoadBalancer:
                  oneOf:
                    - properties:
                        enableLoadBalancer:
                          const: true

                        vpcId:
                          title: VPC ID
                          type: string

                        targetGroupName:
                          title: Target Group Name
                          type: string

                        targetGroupPort:
                          title: Target Group Port
                          type: number
                          default: 8000

                        healthCheckPath:
                          title: Health Check Path
                          type: string
                          default: /health

                        loadBalancerName:
                          title: Load Balancer Name
                          type: string

                        albSecurityGroups:
                          title: ALB Security Groups
                          type: array
                          items:
                            type: string

                        certificateArn:
                          title: ACM Certificate ARN
                          type: string

                      required:
                        - vpcId
                        - targetGroupName
                        - targetGroupPort
                        - healthCheckPath
                        - loadBalancerName
                        - albSecurityGroups
                        - certificateArn

            # =====================================================
            # TRIGGER EXISTING WORKFLOW
            # =====================================================
            - properties:
                serviceMode:
                  const: trigger
              required:
                - repoUrl
                - environment

  ############################
  # STEPS
  ############################
  steps:
    # ---------------------------------------------------------
    # CREATE FLOW (AWS)
    # ---------------------------------------------------------
    - id: create-ecr
      if: ${{ parameters.serviceMode === 'create' }}
      name: Create ECR Repository
      action: aws:ecr:create
      input:
        repositoryName: ${{ parameters.ecrRepository }}
        region: ${{ parameters.awsRegion }}

    - id: register-task-def
      if: ${{ parameters.serviceMode === 'create' }}
      name: Register ECS Task Definition
      action: aws:ecs:register-task-def
      input:
        family: ${{ parameters.ecsServiceName }}
        containerName: ${{ parameters.containerName }}
        containerPort: ${{ parameters.containerPort }}
        image: ${{ parameters.containerImage }}
        cpu: ${{ parameters.cpu }}
        memory: ${{ parameters.memory }}
        region: ${{ parameters.awsRegion }}
        executionRoleArn: arn:aws:iam::369521641981:role/ecsTaskExecutionRole

    # Create Target Group
    - id: create-target-group
      if: ${{ parameters.enableLoadBalancer }}
      name: Create Target Group
      action: aws:elbv2:create-target-group
      input:
        name: ${{ parameters.targetGroupName }}
        protocol: HTTP
        port: ${{ parameters.targetGroupPort }}
        vpcId: ${{ parameters.vpcId }}
        healthCheckPath: ${{ parameters.healthCheckPath }}
        region: ${{ parameters.awsRegion }}

    # Create ALB
    - id: create-alb
      if: ${{ parameters.enableLoadBalancer }}
      name: Create ALB
      action: aws:elbv2:create-alb
      input:
        name: ${{ parameters.loadBalancerName }}
        subnets:
          - subnet-0e1a5c54a6d9fe52b
          - subnet-07cc2e35a5592549c
        securityGroups: ${{ parameters.albSecurityGroups }}
        region: ${{ parameters.awsRegion }}

    # HTTP Listener
    - id: create-http-listener
      if: ${{ parameters.enableLoadBalancer }}
      dependsOn:                
      - create-target-group
      - create-alb
      name: Create HTTP Listener
      action: aws:elbv2:create-listener
      input:
        loadBalancerArn: ${{ steps['create-alb'].output.loadBalancerArn }}
        port: 80
        protocol: HTTP
        targetGroupArn: ${{ steps['create-target-group'].output.targetGroupArn }}
        region: ${{ parameters.awsRegion }}

    # HTTPS Listener
    - id: create-https-listener
      if: ${{ parameters.enableLoadBalancer }}
      dependsOn:                
      - create-target-group
      - create-alb
      name: Create HTTPS Listener
      action: aws:elbv2:create-listener
      input:
        loadBalancerArn: ${{ steps['create-alb'].output.loadBalancerArn }}
        port: 443
        protocol: HTTPS
        certificateArn: ${{ parameters.certificateArn }}
        targetGroupArn: ${{ steps['create-target-group'].output.targetGroupArn }}
        region: ${{ parameters.awsRegion }}

    # ---------------------------------------------------------
    # CREATE ECS SERVICE
    # ---------------------------------------------------------
    - id: create-ecs-service
      if: ${{ parameters.serviceMode === 'create' }}
      dependsOn:                
      - create-target-group
      name: Create ECS Service
      action: aws:ecs:create-service
      input:
        cluster: ${{ parameters.ecsCluster }}
        serviceName: ${{ parameters.ecsServiceName }}
        region: ${{ parameters.awsRegion }}

        taskDefinition: arn:aws:ecs:${{ parameters.awsRegion }}:369521641981:task-definition/${{ parameters.ecsServiceName }}

        subnets:
          - subnet-0e9d3f1ad15c0ee74
          - subnet-07cc2e35a5592549c

        securityGroups:
          - sg-0313a6e7a7b90578c

        loadBalancers:
          - targetGroupArn: ${{ steps['create-target-group'].output.targetGroupArn }}
            containerName: ${{ parameters.containerName }}
            containerPort: ${{ parameters.targetGroupPort }}

    - id: register-service
      if: ${{ parameters.serviceMode === 'create' }}
      name: Register Service in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: >-
          https://github.com/${{
            parameters.repoUrl
              | replace("github.com?owner=", "")
              | replace("&repo=", "/")
          }}/blob/${{ parameters.environment }}
        catalogInfoPath: /catalog-info.yaml
        optional: true

    # ---------------------------------------------------------
    # TRIGGER FLOW
    # ---------------------------------------------------------
    - id: trigger-deployment
      if: ${{ parameters.serviceMode === 'trigger' }}
      name: Trigger Deployment Workflow
      action: github:actions:dispatch
      input:
        repoUrl: ${{ parameters.repoUrl }}
        workflowId: ecs-deploy-dev.yml
        branchOrTagName: dev
        workflowInputs:
          environment: ${{ parameters.environment }}

  ############################
  # OUTPUT
  ############################
  output:
    links:
      - title: GitHub Repository
        url: ${{ parameters.repoUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps['register-service'].output.entityRef }}
      - title: Service URL
        url: https://${{ steps['create-alb'].output.dnsName }}
